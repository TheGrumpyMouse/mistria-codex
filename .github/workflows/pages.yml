name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway — a cancelled deploy can
# leave the site serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The data bundle is a build artifact, not something committed. Building
      # it here is what makes the deployed app's data a pure function of
      # sources + curated, exactly like data/ is.
      #
      # This also writes the static guide (public/guide/, ~1,400 crawlable HTML
      # pages) plus sitemap.xml, robots.txt and llms.txt. MISTRIA_SITE_URL is
      # the absolute origin those need for canonicals and og:url — derived from
      # the repository like BASE_PATH is, so a fork does not publish canonicals
      # pointing at this account's site.
      - name: Ship the data bundle and the guide
        run: pnpm build:ship
        env:
          MISTRIA_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # GitHub Pages serves a project site from /<repo>/, and every URL in the
      # app is built from import.meta.env.BASE_URL. Passing the path in rather
      # than hardcoding it means a fork or a rename does not need a code change.
      #
      # VITE_SYNC_URL is the deployed sync Worker's origin, set as a repository
      # *variable* rather than a secret: it is baked into a public bundle, so
      # calling it a secret would be theatre. Leave it unset and the app builds
      # fine with sync switched off, which is the correct state for a fork that
      # has not deployed a Worker.
      - name: Build
        run: pnpm build:web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          MISTRIA_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}

      # Pages sends fixed response headers and has no rewrite rules, so a
      # request for a path that is not a real file 404s. The app uses hash
      # routing to stay on one document; this is the belt to that braces, for
      # anyone who lands on a bare path from an old link.
      - name: SPA fallback and no-Jekyll
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      # The repo's Pages source must be "GitHub Actions" (Settings -> Pages).
      # Left on "Deploy from a branch" it serves a Jekyll render of the README
      # and RACES this workflow's deploy on every push — both run green and
      # the legacy build wins. The workflow CANNOT fix that itself: changing
      # build_type needs repository *administration* permission, which
      # GITHUB_TOKEN can never hold (pages:write is not enough — the attempt
      # 403s). So this step only detects the misconfiguration and says so,
      # loudly, instead of deploying an artifact nobody will ever see.
      - name: Verify Pages source is GitHub Actions
        run: |
          TYPE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            | jq -r '.build_type // "none"')
          echo "Pages build_type: $TYPE"
          if [ "$TYPE" != "workflow" ]; then
            echo "::error::Pages source is '$TYPE', not 'workflow'. The site is serving the Jekyll README render. Fix: Settings -> Pages -> Build and deployment -> Source -> 'GitHub Actions', then re-run this workflow."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
