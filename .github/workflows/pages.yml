name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway — a cancelled deploy can
# leave the site serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The data bundle is a build artifact, not something committed. Building
      # it here is what makes the deployed app's data a pure function of
      # sources + curated, exactly like data/ is.
      - name: Ship the data bundle
        run: pnpm build:ship

      # GitHub Pages serves a project site from /<repo>/, and every URL in the
      # app is built from import.meta.env.BASE_URL. Passing the path in rather
      # than hardcoding it means a fork or a rename does not need a code change.
      - name: Build
        run: pnpm build:web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages sends fixed response headers and has no rewrite rules, so a
      # request for a path that is not a real file 404s. The app uses hash
      # routing to stay on one document; this is the belt to that braces, for
      # anyone who lands on a bare path from an old link.
      - name: SPA fallback and no-Jekyll
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
