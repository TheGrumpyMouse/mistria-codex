<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mistria Codex</title>
    <meta
      name="description"
      content="An offline field almanac for Fields of Mistria: what is findable today, and where."
    />
    <!-- Painted before the app mounts so a cold load never flashes white. -->
    <meta name="theme-color" content="#FBF8F3" />

    <!-- Search Console Verification -->
    <meta name="google-site-verification" content="vqk3uDYy_aunvdba7QFCoz6wadNmbf263n_JKOYYY3k" />

    <!-- Bing Webmaster Verification -->
    <meta name="msvalidate.01" content="F350EBF207BEB4E7C68FDB90B93217AC" />

    <!--
      Social and structured data for the app's one real URL.

      `%SITE_URL%` is substituted at build time by the `absoluteUrls` plugin in
      vite.config.ts, because og:url and canonical must be absolute and this
      file must not hardcode a host — a fork or a rename would silently point
      every share at somebody else's site. The same reason BASE_PATH is passed
      in rather than written down.

      This wins no per-record indexing: the app is hash-routed, so every screen
      is this URL as far as a crawler is concerned. That is what the static
      guide under public/guide/ exists to solve, and the link to it below is
      how a crawler finds it from here.
    -->
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mistria Codex" />
    <meta property="og:title" content="Mistria Codex" />
    <meta
      property="og:description"
      content="An offline field almanac for Fields of Mistria: what is findable today, and where."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%assets/game/brand/app-icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Mistria Codex",
            "url": "%SITE_URL%",
            "description": "An offline field almanac for Fields of Mistria: what is findable today, and where."
          },
          {
            "@type": "SoftwareApplication",
            "name": "Mistria Codex",
            "applicationCategory": "ReferenceApplication",
            "operatingSystem": "Any",
            "url": "%SITE_URL%",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "about": {
              "@type": "VideoGame",
              "name": "Fields of Mistria",
              "publisher": { "@type": "Organization", "name": "NPC Studio" }
            }
          }
        ]
      }
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- Generated by build:ship from the fetched house mark; both 404
         harmlessly on a clone with no assets, and the SVG mark above carries
         the tab. Declared after the SVG so browsers that rank by order pick
         the house. -->
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="./assets/game/brand/app-icon-64.png"
    />
    <link rel="apple-touch-icon" href="./assets/game/brand/app-icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      The only content on this page that does not need JavaScript, and the one
      link that makes the guide reachable by crawling rather than only from the
      sitemap. No AI crawler executes JavaScript, so without this the app is a
      dead end for them and 1,396 pages are orphans behind an XML file that
      Googlebot reads and they do not.

      In <noscript> because a person with JavaScript sees the app instead, and
      a duplicate nav under a working app would be noise.
    -->
    <noscript>
      <p>
        The Mistria Codex app needs JavaScript. Every record is also published
        as a plain page: <a href="./guide/">browse the guide</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
